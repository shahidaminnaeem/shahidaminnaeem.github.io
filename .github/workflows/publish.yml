name: Update publications and publish homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: homepage-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Scholar data
        id: scholar
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar.py
      - name: Retain successful data update
        if: steps.scholar.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Scholar publications and citation metrics"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/scholar.json _site/data/scholar.json
          if [ -f portrait.jpg ]; then cp portrait.jpg _site/portrait.jpg; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
